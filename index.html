<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fermi-Arena</title>
<style>
:root { --bg:#f7f7f5; --fg:#1d1d1f; --mute:#6b6b70; --line:#dcdcd8; --card:#fff; --acc:#2f5bea; --ok:#1a8a4a; --bad:#c0392b; }
@media (prefers-color-scheme: dark) { :root { --bg:#141416; --fg:#ececee; --mute:#9a9aa2; --line:#2e2e33; --card:#1d1d21; --acc:#7b9bff; --ok:#4cc38a; --bad:#ff7a6b; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); }
header .meta { color:var(--mute); font-size:13px; }
main { max-width:860px; margin:0 auto; padding:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:0 0 12px; }
.hero { text-align:center; } .score { font-size:56px; font-weight:700; }
.q { font-size:18px; font-weight:600; } .sub, .hint { color:var(--mute); font-size:13px; }
button { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
button.primary { background:var(--acc); border-color:var(--acc); color:#fff; } button.link { border:0; background:none; padding:4px; }
button:disabled { opacity:.6; }
input[type=text], input[type=password], select { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--fg); width:100%; margin:3px 0; }
.list { list-style:none; padding:0; margin:0; } .row { width:100%; text-align:left; display:flex; flex-direction:column; gap:4px; margin:0 0 8px; }
.tags i { font-style:normal; font-size:12px; color:var(--mute); border:1px solid var(--line); border-radius:99px; padding:1px 8px; margin-right:4px; }
.tags i.ok { color:var(--ok); border-color:var(--ok); }
.steps { display:flex; gap:6px; list-style:none; padding:0; margin:0 0 8px; flex-wrap:wrap; }
.steps li { font-size:13px; padding:3px 10px; border-radius:99px; border:1px solid var(--line); color:var(--mute); }
.steps li.on { border-color:var(--acc); color:var(--acc); font-weight:600; } .steps li.done { color:var(--ok); }
.timer { font-size:13px; color:var(--mute); margin-bottom:10px; }
.board { overflow-x:auto; }
.op { border:1px dashed var(--line); border-radius:10px; padding:8px; margin:4px 0; }
.op > select { width:auto; } .kids { display:flex; flex-direction:column; gap:2px; }
.sym { text-align:center; font-weight:700; color:var(--acc); }
.leaf { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; }
.lrow { display:flex; gap:6px; } .lrow > * { flex:1; min-width:0; }
.lbtn { display:flex; gap:6px; margin-top:4px; } .lbtn button { font-size:12px; padding:3px 8px; }
.live { margin:12px 0; padding:10px; border-radius:8px; background:var(--card); border:1px solid var(--line); } .live:empty { display:none; }
.ok { color:var(--ok); } .bad { color:var(--bad); }
.err { color:var(--bad); margin:8px 0; }
.actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
.clar, .tag { margin:6px 0; } .tag { display:flex; gap:8px; align-items:center; } .tag span { flex:1; }
.sowhat input { display:inline-block; width:auto; min-width:40%; }
.bar { display:grid; grid-template-columns:150px 1fr 90px; gap:8px; align-items:center; font-size:13px; margin:4px 0; }
.track { height:8px; background:var(--line); border-radius:99px; overflow:hidden; } .fill { height:100%; background:var(--acc); }
table { width:100%; border-collapse:collapse; font-size:13px; } td, th { text-align:left; padding:4px; border-bottom:1px solid var(--line); }
.badges span, .pill { display:inline-block; margin:6px 4px 0; padding:2px 10px; border-radius:99px; background:var(--acc); color:#fff; font-size:13px; }
.radio { display:block; margin:4px 0; }
.toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:8px 14px; border-radius:8px; }
@media (max-width:560px) { .bar { grid-template-columns:100px 1fr 70px; } .lrow { flex-direction:column; gap:0; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="src/app.js"></script>
</body>
</html>
